[package]
name = "sush"
description = "Sush desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Desktop only for now. Mobile targets would need "staticlib" (iOS) and "cdylib" (Android) here.
name = "sush_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sush-core.workspace = true
async-trait.workspace = true
# "unstable" for `Window::add_child`: the built-in browser is a child webview.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
ignore = "0.4"
futures.workspace = true
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net"] }
tokio-util.workspace = true
url = "2"
whisper-rs = "0.16"
dunce = "1.0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSData", "NSProcessInfo", "NSString"] }

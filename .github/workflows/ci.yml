name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Bun comes from GitHub's release downloads, which sometimes answer 504: try three times.
      - uses: oven-sh/setup-bun@v2
        id: bun1
        continue-on-error: true
        with: &bun
          bun-version: 1.2.20
      - if: steps.bun1.outcome == 'failure'
        run: sleep 30
      - uses: oven-sh/setup-bun@v2
        id: bun2
        if: steps.bun1.outcome == 'failure'
        continue-on-error: true
        with: *bun
      - if: steps.bun2.outcome == 'failure'
        run: sleep 60
      - uses: oven-sh/setup-bun@v2
        if: steps.bun2.outcome == 'failure'
        with: *bun
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun --filter desktop build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config cmake libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

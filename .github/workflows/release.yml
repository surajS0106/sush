name: Release

# Push a tag like v2.8.0 on a commit of main to publish it. Nothing is compiled here: the
# installers come from build.yml's run for that exact commit (waited for if it's still running,
# started if there is none), so the release ships what main built and goes out in about a minute.
#
# As GitHub recommends, the release is made as a draft, every file attached, then published,
# so /releases/latest (the app's update feed) never points at a half-uploaded release, and it
# keeps working if immutable releases are turned on.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  actions: write # read build.yml's runs and artifacts, and start one if the commit has none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG is on a commit whose app version is $version. Tag the commit that carries v${TAG#v}."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # A successful build of this commit, else wait for one in progress, else start one.
      # A newer push to main can cancel a build of an older commit, so this tries again.
      - name: Find this commit's build
        run: |
          set -euo pipefail
          runs() { gh run list --workflow build.yml --commit "$SHA" --limit 20 --json databaseId,status,conclusion,createdAt; }
          for attempt in 1 2 3; do
            ok=$(runs | jq -r '[.[] | select(.conclusion == "success")][0].databaseId // empty')
            if [ -n "$ok" ]; then echo "RUN=$ok" >> "$GITHUB_ENV"; echo "Using build run $ok"; exit 0; fi
            live=$(runs | jq -r '[.[] | select(.status != "completed")][0].databaseId // empty')
            if [ -z "$live" ]; then
              echo "No build of $SHA to use; starting one."
              gh workflow run build.yml --ref "$TAG"
              for _ in $(seq 1 30); do
                sleep 5
                live=$(runs | jq -r '[.[] | select(.status != "completed")][0].databaseId // empty')
                [ -n "$live" ] && break
              done
              [ -n "$live" ] || { echo "::error::The build didn't start."; exit 1; }
            fi
            echo "Waiting for build run $live"
            gh run watch "$live" --interval 20 > /dev/null || true
          done
          ok=$(runs | jq -r '[.[] | select(.conclusion == "success")][0].databaseId // empty')
          if [ -n "$ok" ]; then echo "RUN=$ok" >> "$GITHUB_ENV"; echo "Using build run $ok"; exit 0; fi
          echo "::error::No successful build of $SHA. See the Build workflow's runs for this commit."
          exit 1

      - name: Download the installers
        run: |
          gh run download "$RUN" --pattern 'installers-*' --dir dl
          mkdir assets
          find dl -type f ! -name 'platforms-*.json' -exec mv {} assets/ \;
          ls -la assets

      # The update feed: every platform's entries, pointing at this release's files.
      - name: Write latest.json
        run: |
          set -euo pipefail
          count=$(ls dl/*/platforms-*.json | wc -l)
          if [ "$count" -ne 4 ]; then echo "::error::Expected 4 platforms, found $count."; exit 1; fi
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          jq -s --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg base "$base" '{
            version: $v,
            notes: "See the assets below to download the installer for your platform.",
            pub_date: $date,
            platforms: (add | with_entries(.value = {signature: .value.signature, url: "\($base)/\(.value.file)"}))
          }' dl/*/platforms-*.json > assets/latest.json
          cat assets/latest.json | jq '.platforms | map_values(.url)'

      - name: Publish the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A rerun: replace the files on the existing release.
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --draft --verify-tag --title "Sush $TAG" \
              --notes "See the assets below to download the installer for your platform."
          fi
          gh release edit "$TAG" --draft=false --latest

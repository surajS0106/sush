[workspace]
resolver = "2"
members = ["crates/sush-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sush-core = { path = "crates/sush-core" }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
